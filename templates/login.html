{% extends "base.html" %}

{% block content %}
<h2>Login</h2>

{% if erro %}
<p style="color:red;">
    {{ erro }}
</p>
{% endif %}

<form method="POST">
    <input type="text" name="nome" placeholder="Usuário" required>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
</form>

<p>Ainda não tem cadastro? <a href="/cadastro">Cadastre-se</a></p>
{% endblock %}
